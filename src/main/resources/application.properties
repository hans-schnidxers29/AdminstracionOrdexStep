spring.application.name=OrdexStep
server.port=8082
server.servlet.context-path=/admin
spring.web.error.include-message=always
server.servlet.session.cookie.name=ORDEX_ADMIN_SESSION
server.forward-headers-strategy=native
spring.web.locale=es-CO
spring.jackson.time-zone=America/Bogota
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# --- CONFIGURACIÓN BASE DE DATOS (NEON TECH) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.datasource.hikari.pool-name=OrdexStepPool
spring.datasource.hikari.maximum-pool-size=10

# 1. Permite que el pool baje a 0 conexiones (Vital para que Neon entre en auto-suspend/sleep)
spring.datasource.hikari.minimum-idle=0

# 2. Inactividad: Cierra la conexión tras 5 minutos sin uso (300,000 ms)
spring.datasource.hikari.idle-timeout=300000

# 3. Vida máxima de la conexión: Debe ser superior al idle-timeout (10 minutos = 600,000 ms)
spring.datasource.hikari.max-lifetime=600000

# 4. Tiempo de espera de respuesta (30s da margen suficiente para el Cold Start de Neon)
spring.datasource.hikari.connection-timeout=30000

# 5. Evita cierres abruptos por firewalls intermedios en la nube mientras está activa
spring.datasource.hikari.keepalive-time=120000

# 6. Optimización de escrituras masivas en PostgreSQL
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# --- RECURSOS ESTÁTICOS Y CORREO ---
spring.web.resources.static-locations=classpath:/static/
spring.thymeleaf.cache=true
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_APP}
spring.mail.password=${PASSWORD_EMAIL}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
logging.level.org.springframework.mail=DEBUG